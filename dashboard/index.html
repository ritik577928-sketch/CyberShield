<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberShield · Security Analytics &amp; Algorithm Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 4v9c0 8-5 13-12 15C9 28 4 23 4 15V6z' fill='%2338bdf8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><svg viewBox="0 0 32 32" width="30" height="30"><path d="M16 2l12 4v9c0 8-5 13-12 15C9 28 4 23 4 15V6z" fill="var(--accent)"/><path d="M10 16l4 4 8-9" stroke="var(--bg)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>CyberShield</b><small>Security Analytics</small></div></div>
  <nav id="nav"></nav>
  <div class="side-foot"><div class="chip" id="statusChip"><i class="dot"></i><span>connecting…</span></div><small id="heapInfo"></small></div>
</aside>
<div class="main">
  <header class="top">
    <button class="icon-btn menu" id="menuBtn" aria-label="Menu">☰</button>
    <h1 id="pageTitle">Overview</h1>
    <div class="top-actions">
      <label class="sel"><span>Dataset</span><select id="datasetSel"></select></label>
      <button class="btn ghost" id="uploadBtn" title="Analyse your own log file">⬆ Upload log</button>
      <input type="file" id="uploadFile" hidden accept=".log,.txt,.csv">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="js/charts.js"></script>
<script src="js/viz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
